<!doctype html>
<html><head><meta charset="utf-8"><title>Support Bot — Local Admin (Ollama)</title>
<style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:0 24px}input,textarea{width:100%;padding:10px;margin:6px 0}button{padding:10px 18px;cursor:pointer}#log{background:#f4f4f5;padding:12px;white-space:pre-wrap;min-height:80px}</style>
</head><body>
<h1>Support Bot — Local Admin (Ollama)</h1>
<p id="status">Checking Ollama…</p>
<label>Site key <input id="siteKey" value="SITE_DEMO"></label>
<h2>1. Train from URL</h2>
<input id="trainUrl" placeholder="https://example.com/faq">
<button onclick="train()">Train from URL</button>
<h2>…or paste text directly</h2>
<textarea id="trainText" rows="5" placeholder="Paste FAQ / policies / product info here…"></textarea>
<button onclick="trainText()">Train from pasted text</button>
<h2>2. Test chat</h2>
<input id="q" placeholder="Ask something… e.g. what are your hours?">
<button onclick="ask()">Ask</button>
<div id="log"></div>
<script>
const log = (m) => document.getElementById('log').textContent = m + '\n\n' + document.getElementById('log').textContent;
fetch('/api/status').then(r=>r.json()).then(j=>{
  document.getElementById('status').textContent = j.ok
    ? `OK — Ollama connected (chat: ${j.llm || j.chatModel}, models: ${j.models.join(', ')})`
    : `ERROR — Ollama not reachable: ${j.error || ''} — run: ollama serve`;
}).catch(()=> document.getElementById('status').textContent = 'ERROR — server unreachable');
async function train(){
  const siteKey = document.getElementById('siteKey').value;
  const url = document.getElementById('trainUrl').value;
  log('Training from ' + url + ' …');
  const r = await fetch('/api/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({siteKey,url})});
  log(JSON.stringify(await r.json(), null, 2));
}
async function trainText(){
  const siteKey = document.getElementById('siteKey').value;
  const text = document.getElementById('trainText').value;
  log('Training from pasted text (' + text.length + ' chars) …');
  const r = await fetch('/api/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({siteKey,text})});
  log(JSON.stringify(await r.json(), null, 2));
}
async function ask(){
  const siteKey = document.getElementById('siteKey').value;
  const q = document.getElementById('q').value;
  log('YOU: ' + q);
  const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({siteKey,messages:[{role:'user',content:q}]})});
  const j = await r.json();
  log('BOT: ' + j.reply);
}
</script>
</body></html>
